name: Linux ISO

# Builds the bootable Alpine live ISO, boot-smokes it in QEMU, compresses it,
# and attaches the compressed image (plus install-usb.sh) to the release. The
# raw .iso is never published as an asset: users decompress before writing.
#
# Runs on the self-hosted mac mini runner (labels: self-hosted, macOS, ARM64,
# mmcore-iso) instead of a GitHub-hosted ubuntu runner:
#   - the ISO itself is built in the linux/amd64 Alpine container via Docker
#     Desktop (scripts/build-iso.sh), so the host only needs Docker;
#   - the boot smoke runs the host's qemu-system-x86_64 under TCG;
#   - the Linux-only install-usb.sh verification runs inside a privileged
#     Linux container (losetup/sgdisk/mkfs are not available on macOS).
# The runner must have Docker Desktop, qemu (brew install qemu), zstd, and gh.
#
#  - on a version release: attached to that GitHub release;
#  - on push to ports/linux / iso: attached to the rolling 'linux-iso'
#    pre-release for quick testing.
on:
  push:
    branches: [ports/linux, iso]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to attach the built ISO to (e.g. v0.224.0)"
        required: false
        type: string
      skip_smoke:
        description: "Skip the boot-smoke gate (manual re-attach only)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: linux-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iso:
    runs-on: [self-hosted, macOS, mmcore-iso]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Homebrew is not on the runner's default PATH; add it for docker, qemu,
      # zstd, and gh.
      - name: Put Homebrew on PATH
        run: echo "/opt/homebrew/bin" >> "$GITHUB_PATH"

      - name: Ensure Docker is running
        run: |
          if ! docker info >/dev/null 2>&1; then
            echo "Docker is not up; starting Docker Desktop"
            open -a Docker || true
            for _ in $(seq 1 60); do
              docker info >/dev/null 2>&1 && break
              sleep 5
            done
          fi
          docker info >/dev/null 2>&1 || { echo "docker is not available"; exit 1; }

      - name: Build the ISO
        env:
          VERSION: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: scripts/build-iso.sh

      - name: Boot-smoke the ISO against a virtual KMS/DRM device
        if: ${{ !inputs.skip_smoke }}
        # A text-only console has no DRM at all, so the kmsdrm driver can never
        # initialise and a crash-looping mmcore still satisfies `pgrep`. Boot a
        # KMS-capable virtio-gpu instead (the ISO loads virtio_gpu), keep the
        # runner headless with -display none, and drive the guest over the
        # serial console.
        run: |
          # GitHub-hosted runners need the distro qemu; the mac mini runner has
          # it from Homebrew (brew install qemu).
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends qemu-system-x86
          fi
          command -v qemu-system-x86_64 >/dev/null 2>&1 \
            || { echo "qemu-system-x86_64 is required (brew install qemu)"; exit 1; }
          rm -f boot.log serial.in
          mkfifo serial.in
          # O_RDWR on the FIFO never blocks, so a QEMU that fails to start
          # cannot wedge the whole step.
          exec 3<>serial.in
          # -m 6144: the rootfs is packed as a single ~820 MiB initramfs that the
          # kernel unpacks entirely into RAM. Measured on the shipped ISO, 4096
          # MiB still panics with "VFS: Unable to mount root fs" before userspace
          # and 5120 MiB boots, so 6144 leaves headroom (#913). Keep this in step
          # with the "at least 5 GiB" note in docs/framebuffer-and-iso.md.
          timeout 720 qemu-system-x86_64 -m 6144 \
            -cdrom dist/mmcore-fb-x86_64.iso \
            -vga none -device virtio-vga \
            -display none -monitor none \
            -serial stdio \
            -no-reboot -accel tcg <&3 > boot.log 2>&1 &
          qemu_pid=$!

          # The rootfs is ~790 MiB and SDL2 is built from source, so the old
          # fixed 120 s sleep is too tight. Probe until ttyS0's autologin shell
          # answers, then stop. The probe builds its marker with printf so an
          # echoed command line cannot satisfy the check by itself.
          tested=0
          for _ in $(seq 1 60); do
            echo "printf 'MMCORE_%s\n' SHELL_READY" >&3 || true
            sleep 8
            if grep -q MMCORE_SHELL_READY boot.log; then tested=1; break; fi
          done
          if [ "$tested" != 1 ]; then echo "warning: serial shell never answered"; fi

          # Every marker is assembled by printf in the guest, so its literal
          # text never appears in the echoed command line: the greps below only
          # match real command output, not the script we typed.
          {
            echo "printf 'MMCORE_%s\n' ISO_BOOT_OK"
            echo "test -e /dev/dri/card0 && printf 'MMCORE_%s\n' DRM_OK || printf 'MMCORE_%s\n' DRM_MISSING"
            # #918: mmcore starts on tty1 via agetty autologin, which can lag
            # the ttyS0 shell. Poll (bounded) for a PID that is already stable
            # instead of sampling once before mmcore is up, which made STABLE_OK
            # flaky and skipped the ISO asset.
            echo 'ok=0; n=0; while [ "$n" -lt 30 ]; do pgrep -x mmcore | head -n1 > /tmp/p1; if [ -s /tmp/p1 ]; then sleep 6; pgrep -x mmcore | head -n1 > /tmp/p2; cmp -s /tmp/p1 /tmp/p2 && { ok=1; break; }; fi; n=$((n+1)); sleep 2; done; [ "$ok" = 1 ] && printf "MMCORE_%s\n" STABLE_OK || printf "MMCORE_%s\n" STABLE_MISSING'
            echo "grep -q 'could not open SDL window' /tmp/mmcore.stderr 2>/dev/null && printf 'MMCORE_%s\n' SDL_FAIL || printf 'MMCORE_%s\n' SDL_OK"
            # DHCP can be slow (the interface often appears after the shell), so
            # give SLIRP up to ~30 s to hand out 10.0.2.x before failing (#901).
            echo 'n=0; while [ "$n" -lt 6 ]; do ip -4 addr show | grep -q "inet 10.0.2" && break; n=$((n+1)); sleep 5; done; if [ "$n" -lt 6 ]; then printf "MMCORE_%s\n" NET_OK; else printf "MMCORE_%s\n" NET_MISSING; fi'
            # #896: prove the live rootfs CA bundle lets busybox wget verify the
            # GitHub certificate (mmcore-update depends on it). Retries absorb a
            # transient network blip; a cert failure repeats on every attempt.
            echo 'n=0; while [ "$n" -lt 3 ]; do wget -qO- -T 30 https://api.github.com/repos/marnixk/mmcore/releases/latest 2>/tmp/tls.err | grep -q tag_name && break; n=$((n+1)); sleep 4; done; if [ "$n" -lt 3 ]; then printf "MMCORE_%s\n" TLS_OK; else printf "MMCORE_%s\n" TLS_FAIL; sed -n "1,3p" /tmp/tls.err; fi'
            echo 'sleep 5; poweroff'
          } >&3 || true

          wait "$qemu_pid" || true
          echo "---- boot.log tail ----"
          tail -n 60 boot.log || true
          grep -q "MMCORE_ISO_BOOT_OK" boot.log
          grep -q "MMCORE_DRM_OK" boot.log
          grep -q "MMCORE_STABLE_OK" boot.log
          grep -q "MMCORE_SDL_OK" boot.log
          grep -q "MMCORE_NET_OK" boot.log
          grep -q "MMCORE_TLS_OK" boot.log

      - name: Compress the ISO
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends zstd
          fi
          command -v zstd >/dev/null 2>&1 || { echo "zstd is required"; exit 1; }
          zstd -q -19 -T0 -f dist/mmcore-fb-x86_64.iso \
            -o dist/mmcore-fb-x86_64.iso.zst

      # install-usb.sh is Linux-only (uname check, losetup, sgdisk, mkfs.ext4),
      # so verify it inside a privileged linux/amd64 container on the mac runner.
      - name: Verify install-usb.sh writes the compressed ISO and adds the persistence partition
        run: |
          docker run --rm --privileged \
            -v "${PWD}:/repo" -w /repo \
            alpine:3.20 sh -eu -c '
              apk add --no-cache --quiet \
                gdisk e2fsprogs util-linux util-linux-misc parted zstd bash >/dev/null
              truncate -s 2G /tmp/usb.img
              dev="$(losetup --find --show --partscan /tmp/usb.img)"
              echo "loop device: ${dev}"
              bash scripts/install-usb.sh --iso dist/mmcore-fb-x86_64.iso.zst --yes "${dev}"
              partprobe "${dev}" || true
              partx -s "${dev}" || true
              label_dev="$(blkid -L MMCORE)"
              echo "MMCORE is on ${label_dev}"
              [ -n "${label_dev}" ]
              case "${label_dev}" in "${dev}"*) ;; *) echo "unexpected device"; exit 1 ;; esac
              losetup -d "${dev}" || true
            '

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mmcore-iso
          path: dist/mmcore-fb-x86_64.iso.zst
          if-no-files-found: error

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          # Release-event tag, or the workflow_dispatch release_tag input.
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          command -v gh >/dev/null 2>&1 || { echo "gh is required (brew install gh)"; exit 1; }
          # Publish only the compressed image; drop any stale raw .iso asset.
          if [ -n "${RELEASE_TAG}" ]; then
            gh release delete-asset "${RELEASE_TAG}" \
              mmcore-fb-x86_64.iso --yes 2>/dev/null || true
            gh release upload "${RELEASE_TAG}" \
              dist/mmcore-fb-x86_64.iso.zst scripts/install-usb.sh --clobber
            echo "Attached the compressed ISO and install-usb.sh to release ${RELEASE_TAG}"
            exit 0
          fi

          tag="linux-iso"
          notes="Automated ISO build from ${GITHUB_REF_NAME} at ${GITHUB_SHA:0:7}.

          Decompress, then write it to a USB stick; install-usb.sh adds a persistent MMCORE partition:
          \`\`\`
          zstd -d mmcore-fb-x86_64.iso.zst
          sudo ./install-usb.sh --iso mmcore-fb-x86_64.iso /dev/sdX
          \`\`\`"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --prerelease \
              --title "Linux ISO (rolling)" \
              --notes "$notes"
          else
            gh release edit "$tag" --notes "$notes"
          fi
          gh release delete-asset "$tag" mmcore-fb-x86_64.iso --yes 2>/dev/null || true
          gh release upload "$tag" \
            dist/mmcore-fb-x86_64.iso.zst scripts/install-usb.sh --clobber
