name: Linux ISO

# Builds the bootable Alpine live ISO, boot-smokes it in QEMU, compresses it,
# and attaches the compressed image (plus install-usb.sh) to the release. The
# raw .iso is never published as an asset: users decompress before writing.
#
#  - on a version release: attached to that GitHub release;
#  - on push to ports/linux / iso: attached to the rolling 'linux-iso'
#    pre-release for quick testing.
on:
  push:
    branches: [ports/linux, iso]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to attach the built ISO to (e.g. v0.224.0)"
        required: false
        type: string
      skip_smoke:
        description: "Skip the boot-smoke gate (manual re-attach only)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: linux-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iso:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build the ISO
        env:
          VERSION: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: scripts/build-iso.sh

      - name: Boot-smoke the ISO against a virtual KMS/DRM device
        if: ${{ !inputs.skip_smoke }}
        # A text-only console has no DRM at all, so the kmsdrm driver can never
        # initialise and a crash-looping mmcore still satisfies `pgrep`. Boot a
        # KMS-capable virtio-gpu instead (the ISO loads virtio_gpu), keep the
        # runner headless with -display none, and drive the guest over the
        # serial console.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86
          rm -f boot.log serial.in
          mkfifo serial.in
          # O_RDWR on the FIFO never blocks, so a QEMU that fails to start
          # cannot wedge the whole step.
          exec 3<>serial.in
          timeout 720 qemu-system-x86_64 -m 2048 \
            -cdrom dist/mmcore-fb-x86_64.iso \
            -vga none -device virtio-vga \
            -display none -monitor none \
            -serial stdio \
            -no-reboot -accel tcg <&3 > boot.log 2>&1 &
          qemu_pid=$!

          # The rootfs is ~790 MiB and SDL2 is built from source, so the old
          # fixed 120 s sleep is too tight. Probe until ttyS0's autologin shell
          # answers, then stop. The probe builds its marker with printf so an
          # echoed command line cannot satisfy the check by itself.
          tested=0
          for _ in $(seq 1 60); do
            echo "printf 'MMCORE_%s\n' SHELL_READY" >&3 || true
            sleep 8
            if grep -q MMCORE_SHELL_READY boot.log; then tested=1; break; fi
          done
          if [ "$tested" != 1 ]; then echo "warning: serial shell never answered"; fi

          # Every marker is assembled by printf in the guest, so its literal
          # text never appears in the echoed command line: the greps below only
          # match real command output, not the script we typed.
          {
            echo "printf 'MMCORE_%s\n' ISO_BOOT_OK"
            echo "test -e /dev/dri/card0 && printf 'MMCORE_%s\n' DRM_OK || printf 'MMCORE_%s\n' DRM_MISSING"
            echo 'pgrep -x mmcore | head -n1 > /tmp/p1; sleep 6; pgrep -x mmcore | head -n1 > /tmp/p2'
            echo "cmp -s /tmp/p1 /tmp/p2 && [ -s /tmp/p1 ] && printf 'MMCORE_%s\n' STABLE_OK || printf 'MMCORE_%s\n' STABLE_MISSING"
            echo "grep -q 'could not open SDL window' /tmp/mmcore.stderr 2>/dev/null && printf 'MMCORE_%s\n' SDL_FAIL || printf 'MMCORE_%s\n' SDL_OK"
            echo "ip -4 addr show | grep -q 'inet 10.0.2' && printf 'MMCORE_%s\n' NET_OK || printf 'MMCORE_%s\n' NET_MISSING"
            echo 'sleep 5; poweroff'
          } >&3 || true

          wait "$qemu_pid" || true
          echo "---- boot.log tail ----"
          tail -n 60 boot.log || true
          grep -q "MMCORE_ISO_BOOT_OK" boot.log
          grep -q "MMCORE_DRM_OK" boot.log
          grep -q "MMCORE_STABLE_OK" boot.log
          grep -q "MMCORE_SDL_OK" boot.log
          grep -q "MMCORE_NET_OK" boot.log

      - name: Compress the ISO
        run: |
          sudo apt-get install -y --no-install-recommends zstd
          zstd -q -19 -T0 -f dist/mmcore-fb-x86_64.iso \
            -o dist/mmcore-fb-x86_64.iso.zst

      - name: Verify install-usb.sh writes the compressed ISO and adds the persistence partition
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gdisk e2fsprogs util-linux zstd
          truncate -s 2G /tmp/usb.img
          dev="$(sudo losetup --find --show --partscan /tmp/usb.img)"
          echo "loop device: ${dev}"
          sudo scripts/install-usb.sh --iso dist/mmcore-fb-x86_64.iso.zst --yes "${dev}"
          sudo partprobe "${dev}" || true
          sudo udevadm settle || true
          sudo partx -s "${dev}" || true
          label_dev="$(sudo blkid -L MMCORE)"
          echo "MMCORE is on ${label_dev}"
          [ -n "${label_dev}" ]
          case "${label_dev}" in "${dev}"*) ;; *) echo "unexpected device"; exit 1 ;; esac
          sudo losetup -d "${dev}" || true

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mmcore-iso
          path: dist/mmcore-fb-x86_64.iso.zst
          if-no-files-found: error

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          # Release-event tag, or the workflow_dispatch release_tag input.
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          # Publish only the compressed image; drop any stale raw .iso asset.
          if [ -n "${RELEASE_TAG}" ]; then
            gh release delete-asset "${RELEASE_TAG}" \
              mmcore-fb-x86_64.iso --yes 2>/dev/null || true
            gh release upload "${RELEASE_TAG}" \
              dist/mmcore-fb-x86_64.iso.zst scripts/install-usb.sh --clobber
            echo "Attached the compressed ISO and install-usb.sh to release ${RELEASE_TAG}"
            exit 0
          fi

          tag="linux-iso"
          notes="Automated ISO build from ${GITHUB_REF_NAME} at ${GITHUB_SHA:0:7}.

          Decompress, then write it to a USB stick; install-usb.sh adds a persistent MMCORE partition:
          \`\`\`
          zstd -d mmcore-fb-x86_64.iso.zst
          sudo ./install-usb.sh --iso mmcore-fb-x86_64.iso /dev/sdX
          \`\`\`"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --prerelease \
              --title "Linux ISO (rolling)" \
              --notes "$notes"
          else
            gh release edit "$tag" --notes "$notes"
          fi
          gh release delete-asset "$tag" mmcore-fb-x86_64.iso --yes 2>/dev/null || true
          gh release upload "$tag" \
            dist/mmcore-fb-x86_64.iso.zst scripts/install-usb.sh --clobber
