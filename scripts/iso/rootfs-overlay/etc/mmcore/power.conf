# mmcore power button policy (#1268).
#
# This file is sourced as a shell fragment by /etc/acpi/mmcore-power.sh.
#
# On a Chromebook the power key sits directly above Backspace, so a missed
# Backspace must not shut the whole machine down. The key is ignored there;
# every other machine keeps the clean shutdown.
#
#   auto      Ignore the power button on a Chromebook (detected from DMI; ARM
#             device trees name Google in /sys/firmware/devicetree). Default.
#   ignore    Never power off from a short power-button press. Storage is still
#             synced, and the volumes stay mounted because the session
#             continues.
#   poweroff  Always run the normal clean shutdown.
#
# This only affects a short press. On Chromebooks the embedded controller still
# turns the machine off after a long press (about 10 seconds), and setting
# `poweroff` restores immediate shutdown.
#
# The root filesystem is a squashfs on a RAM overlay, so this file is read-only
# unless the boot uses a persistent overlay (a live card written with
# install-usb.sh --read-write). There, edit it and reboot; on a RAM-overlay
# session the shipped `auto` default returns at the next boot.
MMCORE_POWER_KEY=auto
