# mmcore audio routing overrides (#1075).
#
# This file is sourced as a shell fragment by
# /etc/local.d/mmcore-audio.start. Board-specific UCM verbs and ALSA control
# names are not knowable from the ISO build host, so they live here; the
# helper falls back to the comments' values when this file is absent. On an
# installed system edit this file and run `rc-service local restart` (or
# reboot) to apply the change.
#
# Values are POSIX shell assignments. The *_CONTROLS / UCM_VERBS lists are
# newline-separated, one name per line, so names may contain spaces.

# ALSA UCM verbs to try for each card, in order. `alsaucm -c hw:N list _verbs`
# lists the verbs a card supports; typical values are HiFi, Headset, Speaker.
# UCM_VERBS='HiFi'

# UCM devices selected with `alsaucm ... set _enadev`, per jack state.
# UCM_ENADEV_SPEAKER='Speaker'
# UCM_ENADEV_HEADPHONES='Headphones'

# Mixer controls used when a board has no usable UCM profile. The speaker
# controls are muted while the jack is in and unmuted otherwise; the headphone
# controls the reverse.
# SPEAKER_CONTROLS='Speaker
# Bass Speaker'
# HEADPHONE_CONTROLS='Headphone
# Front Headphone
# Headphones'

# ALSA kcontrols that report the jack, used only when the board has no EV_SW
# switch (uncomment a name with its leading '#' removed to enable the list).
# JACK_CONTROLS='Headphone Jack
# Front Headphone Jack
# Headset Jack
# Headphone Mic Jack
# Line Out Switch
# Line Out Jack'

# --- Board setup: DA7219 headphone route (#1075) -------------------------
#
# Cards built on the DA7219 codec (SOF machine "glkda7219max", card name
# "sofgylkda7219max", e.g. Google Phaser and other GLK Chromebooks) ship no
# UCM profile on this image, and the codec's DAPM defaults leave the DAC
# disconnected from the output mixers with both the DAC mute and headphone
# mute set, so headphone playback on the codec PCM is silent. Each line below
# is `name=value` applied once with `amixer cset`; a line whose control is not
# present on a card is skipped, so the same file is a no-op on other codecs.
#
# The values come from da7219.c: MIXOUT_L/R_SELECT default 0 (DAC not routed
# to the output mixers), DAC_L/R_CTRL and HP_L/R_CTRL default 0x40 (muted),
# and the SOF machine driver's "Headphone Jack Switch" pin gate default off.
HEADPHONE_SETUP='Headphone Jack Switch=on
Out DACL Mux=DAIL
Out DACR Mux=DAIR
Mixer Out FilterL DACL Switch=on
Mixer Out FilterR DACR Switch=on
ST Mixer Out FilterL Out FilterL Switch=on
ST Mixer Out FilterR Out FilterR Switch=on
Playback Digital Switch=on
Headphone Switch=on
Headphone Volume=57,57
DAC Soft Mute Switch=off
DAC NG Switch=off'

# --- Jack detection for the DA7219 board (#1075) -------------------------
#
# The setup above forces the machine PIN_SWITCH "Headphone Jack Switch" on, so
# detection must not read a control we drove ourselves. On the glkda7219max
# card the real jack status is the CARD control "Line Out Jack"
# (values=false -> true on insert; the machine classifies the headset as line
# out), with "Line Out Switch" as a fallback. BOARD_MATCH scopes this to that
# card so every other machine keeps the generic detection.
BOARD_MATCH='glkda7219'
HEADPHONE_JACK_CONTROLS='Line Out Jack
Line Out Switch'

# --- ALSA `default` override (#1075) -------------------------------------
#
# mmcore-fb opens SDL's default ALSA device, which on this SOF card is the
# internal speaker PCM (card0/device0), while the headphones are a separate
# PCM. Turn `pcm.!default` into a `multi` that plays to both, so mmcore reaches
# the headphones with no code change and no wait for the kernel's jack-type
# classification (the DA7219 only reports the type after a slow HP-test). The
# value is a substring matched against the playback PCM names in
# /proc/asound/pcm ("Headset" is the DA7219 playback PCM on glkda7219max); the
# speaker is assumed to be device 0. Only /etc/asound.conf is written, and only
# when it is absent or already owned by this script.
HEADPHONE_PCM_MATCH='Headset'
